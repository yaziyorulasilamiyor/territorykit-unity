[project]
name = "geometry-api"
version = "0.1.0"
description = "TerritoryKit.Unity geometry service — triangulates region polygons and serves binary meshes"
requires-python = ">=3.12"
# Pinned exactly, not floored. The build output is byte-for-byte reproducible and Phase 3's
# content-addressed cache keys off that, so a shapely or earcut release that changes a
# triangulation by one vertex must be an explicit upgrade, not something that arrives on its own.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "shapely==2.1.2",
    "mapbox-earcut==2.0.0",
    "numpy==2.5.2",
    # Topology-preserving simplification (Phase 2). 1.10 is the floor, not a preference:
    # 1.9 calls numpy's `in1d`, removed in numpy 2.0, so it cannot run against the pin above.
    "topojson==1.10",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.2",
    "mypy==2.3.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/geometry_api"]
