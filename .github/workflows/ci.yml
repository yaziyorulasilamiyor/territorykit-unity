name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  geometry-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/geometry-api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Fetch sample dataset
        working-directory: .
        run: python scripts/fetch_sample_dataset.py

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        run: mypy src/

      - name: Test (pytest)
        # The real-dataset tests skip themselves when the data is missing. In CI a skip would
        # mean the 81-province build, the coverage sweep, the uint16 ceiling and the determinism
        # check never ran at all, so here a skip is a failure.
        env:
          GEOMETRY_API_REQUIRE_SAMPLE_DATASET: "1"
        run: pytest -q --cov=geometry_api
