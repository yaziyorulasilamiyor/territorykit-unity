name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  geometry-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/geometry-api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Fetch sample dataset
        working-directory: .
        run: python scripts/fetch_sample_dataset.py

      - name: Lint (ruff)
        run: |
          ruff check . ../../scripts
          ruff format --check . ../../scripts

      - name: Type check (mypy)
        run: mypy src/

      - name: Test (pytest)
        # The real-dataset tests skip themselves when the data is missing. In CI a skip would
        # mean the 81-province build, the coverage sweep, the uint16 ceiling and the determinism
        # check never ran at all, so here a skip is a failure.
        env:
          GEOMETRY_API_REQUIRE_SAMPLE_DATASET: "1"
        run: pytest -q --cov=geometry_api

  lod-chain:
    # The LOD chain runs the TerritoryKit CLI out of the submodule, so it needs Node as well as
    # Python. Kept as its own job so a Node problem cannot be mistaken for a geometry failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          # vendor/territorykit requires >=22; pnpm comes from its packageManager pin via corepack.
          node-version: "22"

      - name: Install Python dependencies
        working-directory: services/geometry-api
        run: pip install -e ".[dev]"

      - name: Fetch sample dataset
        run: python scripts/fetch_sample_dataset.py

      - name: Build the TerritoryKit CLI
        working-directory: vendor/territorykit
        run: |
          corepack enable pnpm
          # pnpm blocks @scarf/scarf's (telemetry) install script and turns that into exit 1.
          # The script stays blocked either way; this only stops it failing the build.
          pnpm config set strict-dep-builds false --location=global
          pnpm install --frozen-lockfile
          pnpm --filter "@territory-kit/cli..." build

      - name: Build all three detail levels
        run: |
          python scripts/build_lod.py \
            --input services/geometry-api/data/datasets/turkey-provinces.geojson \
            --output "$RUNNER_TEMP/lod" --clean

      - name: Check the level ladder
        # The two --expect flags pin this specific dataset. The chain is deterministic, so a
        # change to either number means the source file or the pipeline moved, and that should
        # be acknowledged in a commit rather than absorbed silently.
        run: |
          python scripts/check_lod_report.py "$RUNNER_TEMP/lod/lod-report.json" \
            --expect-high-vertices 240379 \
            --expect-territory-count 81

  docker:
    # Not nested in the geometry-api job: that job's defaults.run.working-directory is
    # services/geometry-api, which would resolve "./services/geometry-api" below to a path that
    # does not exist. This job runs at the repo root instead — see docs/phases/FAZ-3-PLAN.md §15.
    #
    # Docker Desktop does not run in this project's local dev environment (FAZ-0/1/2-RAPOR.md
    # Tıkanmalar), so this is the only place the image is proven to actually start and serve
    # traffic, not just build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t geometry-api:ci ./services/geometry-api

      - name: Run container
        run: docker run -d --name geometry-api-ci -p 8000:8000 geometry-api:ci

      - name: Wait for health (max 60s)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "container did not become healthy within 60s" >&2
          exit 1

      - name: Dump container logs on failure
        if: failure()
        run: docker logs geometry-api-ci

      - name: Cleanup
        if: always()
        run: docker rm -f geometry-api-ci || true
