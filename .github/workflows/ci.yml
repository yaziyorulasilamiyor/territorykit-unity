name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  geometry-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/geometry-api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        run: mypy src/

      - name: Test (pytest)
        run: pytest -q --cov=geometry_api
